name: check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Validate data files
        run: |
          status=0
          for f in data/*.json; do
            echo "::group::$f"
            python3 validate.py "$f" || { echo "::error file=$f::validate.py found errors"; status=1; }
            echo "::endgroup::"
          done
          exit $status

      - name: Built site is up to date
        run: |
          python3 build.py
          if [ -n "$(git status --porcelain)" ]; then
            git status --short
            echo "::error::Run python3 build.py and commit index.html, data.<hash>.json and any new flags/ files."
            exit 1
          fi
